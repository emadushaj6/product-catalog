_schema-version: 3.3.0
ID: product-catalog
version: 1.0.0
description: "A simple CAP project."

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: product-catalog-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: product-catalog-auth
      - name: product-catalog-db
      - name: product-catalog-destination

  - name: product-catalog-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: product-catalog-db


  - name: productcatalogproductcatalog
    type: html5
    path: app/productcatalog
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: product-catalog-app-deployer
    type: com.sap.application.content
    path: gen
    requires:
      - name: product-catalog-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: app/
      requires:
        - name: productcatalogproductcatalog
          artifacts:
            - productcatalog.zip
          target-path: app/

  - name: product-catalog-destinations
    type: com.sap.application.content
    requires:
      - name: product-catalog-auth
        parameters:
          service-key:
            name: product-catalog-auth-key
      - name: product-catalog-html5-repo-host
        parameters:
          service-key:
            name: product-catalog-html5-repo-host-key
      - name: srv-api
      - name: product-catalog-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: product-catalog-html5-repository
              ServiceInstanceName: product-catalog-html5-repo-host
              ServiceKeyName: product-catalog-html5-repo-host-key
              HTML5Runtime_enabled: true
              sap.cloud.service: productcatalog.service

            - Name: product-catalog-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: product-catalog-auth
              ServiceKeyName: product-catalog-auth-key
              sap.cloud.service: productcatalog.service

resources:
  - name: product-catalog-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: product-catalog-${org}-${space}
        tenant-mode: dedicated

  - name: product-catalog-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: product-catalog-destination
    type: org.cloudfoundry.managed-service
    requires:
      - name: srv-api
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
      init_data:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: srv-api
              URL: ~{srv-api/srv-url}
              Authentication: NoAuthentication
              Type: HTTP
              ProxyType: Internet
              HTML5.ForwardAuthToken: true
              HTML5.DynamicDestination: true
              sap.cloud.service: productcatalog.service

  - name: product-catalog-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host